# CI (spec §134, INF-005): typecheck · lint · format · unit tests · control-doc validation ·
# content validation · build on every PR and push to main. The simulator regression step joins
# this workflow when that package exists (Phase 10).
#
# Deploy jobs run only when the repository variable CLOUDFLARE_DEPLOY is "true" and the
# secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are set. Environments are chosen at
# build time via CLOUDFLARE_ENV (Cloudflare Vite plugin); `wrangler deploy --env` has no effect.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Check and deploy the immutable source head, not a synthetic PR merge commit.
env:
  BLOOMLAB_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:adversarial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-${{ env.BLOOMLAB_BUILD_ID }}
          path: .review/adversarial/adversarial.*
          include-hidden-files: true
          if-no-files-found: warn
      - run: npm run validate:docs
      - run: npm run validate:field-ready-status
      - run: npm run security:source
      # Content validation (CNT-011): every ID resolves, no missing prerequisite or unknown GHL
      # feature, and content.lock.yaml matches the sources (content_version was bumped).
      - run: npm run content:check
      - run: npm run content:terminology
      - run: npm run review:screen-inventory
      - run: npm run content:freshness
      - run: npm run voice:check
      - run: npm run build
        env:
          CLOUDFLARE_ENV: production
      # Ubuntu's real Chrome + pinned axe-core. All default rules; serious/critical fail.
      - run: google-chrome --version
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-${{ env.BLOOMLAB_BUILD_ID }}
          path: .review/accessibility/a11y-probe.json
          include-hidden-files: true
          if-no-files-found: warn

  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request' && vars.CLOUDFLARE_DEPLOY == 'true'
    needs: checks
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Read configuration only. Fail before deployment if either private-media bucket is public.
      - run: npm run security:cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build:preview -w @bloomlab/web
        env:
          CLOUDFLARE_ENV: preview
      # Schema first, code second: the preview Worker never runs against an older schema.
      # Migrations reach bloomlab-dev here, and bloomlab-prod only on the production job (DATA-010).
      - run: |
          mkdir -p ../.review/field-ready
          npx wrangler d1 migrations apply bloomlab-dev --remote --env preview 2>&1 | tee ../.review/field-ready/migrations.log
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          mkdir -p ../../.review/field-ready
          npx wrangler deploy 2>&1 | tee ../../.review/field-ready/deploy.log
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Exact-head deployed Preview closeout
        run: npm run review:field-ready-preview
        env:
          BASE: https://bloomlab-preview.cool-sunset-2169.workers.dev
          REVIEW_HEAD: ${{ env.BLOOMLAB_BUILD_ID }}
          REVIEW_OUT: .review/field-ready
          REVIEW_SCROLLBARS: '1'
          CHROME_FLAGS: --use-fake-ui-for-media-stream --use-fake-device-for-media-stream
          FIELDWORK_LIVE: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-ready-preview-${{ env.BLOOMLAB_BUILD_ID }}
          path: |
            .review/field-ready
            .content/ghl-terminology.json
            .content/ghl-terminology.md
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @bloomlab/web
        env:
          CLOUDFLARE_ENV: production
      - run: npx wrangler d1 migrations apply bloomlab-prod --remote --env production
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Exact bytes were promoted before merge. Verify them and publish only authored metadata.
      - run: npm run voice:index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
