id: PRJ-application-funnel-proposal
title: Application Funnel
tier: field_ready
brief: >-
  Marcus at Summit wants fewer unqualified calls and faster replies to applications, and he has

  a cheaper quote in hand. Run discovery, price the application funnel, and handle the

  push-back — ending with a proposal he can accept or a clean walk-away.


  Then build and test the application and qualification path in the Funnel Lab. The saved sales work
  does not stand in for an implemented customer path.
client: CL-summit-coaching
skills:
  - SK-SELL-discovery-call
  - SK-SELL-project-pricing
  - SK-SELL-negotiation-basics
  - SK-DELIVER-proposal-writing
  - SK-BUILD-lead-capture-form
  - SK-BUILD-conversion-copy
stages:
  - id: s1
    name: Discovery
    exercises:
      - EX-SAY_IT-summit-discovery
    deliverable: A discovery recap Marcus agrees with.
  - id: s2
    name: Pricing
    exercises:
      - EX-PRICE_IT-summit-application-funnel
    deliverable: A priced scope with deposit, timeline, inclusions and exclusions.
  - id: s3
    name: Negotiation
    exercises:
      - EX-NEGOTIATE_IT-summit-freelancer-quote
    deliverable: A response to the cheaper quote that keeps margin or walks away.
  - id: s4
    name: Proposal
    exercises:
      - EX-WRITE_IT-summit-proposal
    deliverable: A proposal with all eight sections, in Marcus's language, that he can accept in one reply.
  - id: s5
    name: Build and test the application
    exercises:
      - EX-FUNNEL_ASSEMBLY-summit-application
    deliverable: A connected capture, qualification, booking and confirmation path with recorded
      new/repeat submissions.
fieldwork_required: false
portfolio: PF-application-qualification-system
capstone: false
