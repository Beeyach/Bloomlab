# FIX IT (spec §27): symptoms only — "Maria received two reminder messages. Expected one."
id: EX-FIX_IT-double-reminder
type: FIX_IT
title: Maria received two reminders
mode: practice
difficulty: 3
estimated_minutes: 25
skills:
  - SK-AUTOMATE-reentry-and-duplicates
  - SK-DIAGNOSE-workflow-troubleshooting
scenario: SC-glowhaus-double-reminder
instructions: |
  Dana says: "Maria got two reminder texts yesterday, word for word the same. One lead replied
  *stop texting me*. I only built one reminder."

  Find out why, using the execution logs before you open any workflow. Fix the cause — not the
  symptom — so every booked lead gets exactly one reminder the day before.
allowed_features:
  - GHL-WF-APPOINTMENT-STATUS
  - GHL-WF-CUSTOMER-BOOKED-APPOINTMENT
  - GHL-WF-WAIT
  - GHL-WF-SEND-SMS
  - GHL-WF-ADD-CONTACT-TAG
  - GHL-WF-REMOVE-FROM-WORKFLOW
starting_state:
  notes: Both workflows are published and enrolling.
expected_outcomes:
  - id: a1
    type: event
    event: sms.sent
    count: { exactly: 1 }
    where: { contact_id: maria, purpose: reminder_24h }
    description: Maria receives exactly one reminder.
  - id: a2
    type: architecture
    requirement: action_exists
    ghl_feature: GHL-WF-ADD-CONTACT-TAG
    description: The booked tag is still applied (the tagging workflow keeps its real job).
  - id: a3
    type: state
    path: contacts.maria.tags
    operator: contains
    value: booked
    description: Maria still ends up tagged booked.
critical_failures:
  - id: c1
    type: event
    event: sms.sent
    count: { max: 1 }
    where: { contact_id: maria }
    description: More than one reminder to the same contact is the original fault.
grading:
  mode: deterministic
  weights:
    correctness: 45
    edge_cases: 15
    architecture: 20
    maintainability: 10
    explanation: 10
  pass_threshold: 70
hints:
  - level: nudge
    text: Two identical texts usually means two senders, not one sender running twice. Which workflows enrolled Maria yesterday?
  - level: concept_reminder
    text: Customer Booked Appointment and Appointment Status (New) both fire on the same booking. Two workflows listening to the same moment will both act.
  - level: worked_example
    text: Open Booking Tags — it has a copied Wait and Send SMS after the tag. Remove those two steps (or the whole reminder branch) and leave the reminder to Appointment Reminders.
fieldwork: null
portfolio: null
