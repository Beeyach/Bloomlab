id: EX-WRITE_IT-glowhaus-onboarding
type: WRITE_IT
title: Before the build begins
skills:
  - SK-DELIVER-proposal-writing
  - SK-DELIVER-client-explanation
instructions: >-
  Glowhaus has accepted a one-location consultation system, subject to a deposit and receipt of
  inputs. Priya owns the account but her freelance designer controls the domain. Theo manages
  calendars; Dana handles new enquiries. The second location is excluded. Launch is requested in ten
  working days, and no copy has been approved.


  Prepare the onboarding request using every section below. Record an owner, action and acceptance
  check. Unknown information is a dependency to resolve, not a fact to invent. Use invitation and
  secure transfer processes; never enter a real password, token or payment detail in Bloomlab.
mode: independent
difficulty: 3
estimated_minutes: 35
client: CL-glowhaus-medspa
