written_fields:
  - key: access
    label: Access
    help: Which accounts, permission level, owner and access test will you request?
    rows: 4
  - key: credentials
    label: Credentials
    help: How will credentials or invitations be transferred without pasting secrets in this answer?
    rows: 4
  - key: domains
    label: Domains
    help: Who controls DNS, which domain is approved, and how will ownership and connection be checked?
    rows: 4
  - key: calendars
    label: Calendars
    help: Who approves staff availability, duration, buffers, locations and connected calendars?
    rows: 4
  - key: users
    label: Users
    help: Who needs which role, who handles leads, and who covers absence?
    rows: 4
  - key: branding
    label: Branding
    help: What approved brand assets and permission to use them are still needed?
    rows: 4
  - key: copy
    label: Copy
    help: Who writes, reviews and signs off page, form and message copy?
    rows: 4
  - key: payment
    label: Payment
    help: What deposit, billing approval and test-only payment boundary must be settled?
    rows: 4
  - key: expectations
    label: Expectations
    help:
      What counts as acceptance, who decides, and how do response windows and missed inputs affect
      dates?
    rows: 4
