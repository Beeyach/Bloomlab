written_fields:
  - key: lead_capture
    label: lead capture
    help: A cleaning company wants a callback for a standard service.
    rows: 4
  - key: lead_magnet
    label: lead magnet
    help: A coach offers a preparation worksheet to people who are not ready for a call.
    rows: 4
  - key: consultation
    label: consultation
    help: A med spa offers a suitability consultation, without promising treatment eligibility.
    rows: 4
  - key: appointment
    label: appointment
    help: A photographer books a clearly described mini-session.
    rows: 4
  - key: quote_request
    label: quote request
    help: A roofer needs location, roof type and an inspection before naming a price.
    rows: 4
  - key: application
    label: application
    help: A consultant has limited engagements and a minimum project size.
    rows: 4
  - key: assessment
    label: assessment
    help: A fitness coach uses a readiness assessment, not a medical diagnosis.
    rows: 4
  - key: vsl_to_call
    label: vsl to call
    help: A coach explains a complex programme before inviting applications.
    rows: 4
  - key: content_to_booking
    label: content to booking
    help: A therapist publishes a service explainer with an optional enquiry path.
    rows: 4
  - key: service_inquiry
    label: service inquiry
    help: A wedding vendor needs date and venue before confirming availability.
    rows: 4
  - key: reactivation
    label: reactivation
    help: A local gym invites eligible former trial members to ask about a new schedule.
    rows: 4
