id: EX-WHAT_WOULD_YOU_BUILD-eleven-paths
type: WHAT_WOULD_YOU_BUILD
title: Design the next step for eleven businesses
skills:
  - SK-STRATEGIZE-funnel-math
  - SK-JUDGMENT-automation-appropriateness
instructions: 'For each fictional brief, write a short page/system sequence: visitor intent, offer,
  information requested, next action and responsible follow-up. Name the funnel family if one is
  useful, or defend a simpler alternative. Do not copy the same capture-and-book sequence into every
  answer. Judge what the customer and operator each need.'
mode: independent
difficulty: 3
estimated_minutes: 55
client: CL-glowhaus-medspa
