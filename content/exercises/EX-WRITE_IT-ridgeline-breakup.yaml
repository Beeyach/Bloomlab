client: CL-ridgeline-roofing
format: breakup_email
instructions: |
  You have emailed Dale at Ridgeline three times over five weeks. The first got a one-line "send me
  something next month". The other two got nothing.

  Write the last one. Close the loop, leave the door open, and do not guilt him. Under 80 words.
  Nothing in it should ask him to explain himself, and nothing in it should pretend you know why he
  went quiet.
