# REBUILD BLIND (spec §27): no lesson, no step-by-step support.
id: EX-REBUILD_BLIND-appointment-reminders
type: REBUILD_BLIND
title: Rebuild the reminder system from nothing
mode: pressure
difficulty: 4
estimated_minutes: 30
skills:
  - SK-AUTOMATE-appointment-reminders
scenario: SC-glowhaus-no-show
instructions: |
  Glowhaus's reminder workflow was deleted. Rebuild it: one reminder 24 hours before every
  consultation, one reminder 2 hours before, nothing for cancelled appointments, and nothing twice.
allowed_features:
  - GHL-WF-APPOINTMENT-STATUS
  - GHL-WF-CUSTOMER-BOOKED-APPOINTMENT
  - GHL-WF-WAIT
  - GHL-WF-SEND-SMS
  - GHL-WF-IF-ELSE
  - GHL-WF-REMOVE-FROM-WORKFLOW
starting_state: {}
expected_outcomes:
  - id: a1
    type: timing
    event: sms.sent
    relative_to: appointment.start
    offset_minutes: -1440
    tolerance_minutes: 10
    description: A reminder arrives 24 hours before the appointment.
  - id: a2
    type: timing
    event: sms.sent
    relative_to: appointment.start
    offset_minutes: -120
    tolerance_minutes: 10
    description: A reminder arrives 2 hours before the appointment.
  - id: a3
    type: event
    event: sms.sent
    count: { exactly: 2 }
    where: { contact_id: maria, purpose: reminder }
    description: Exactly two reminders per booking.
critical_failures:
  - id: c1
    type: negative
    event: sms.sent
    where: { contact_id: maria, appointment_status: cancelled }
    description: A cancelled appointment must not receive a reminder.
grading:
  mode: deterministic
  weights:
    correctness: 45
    edge_cases: 25
    architecture: 15
    maintainability: 10
    explanation: 5
  pass_threshold: 80
hints: []
fieldwork: null
portfolio: null
