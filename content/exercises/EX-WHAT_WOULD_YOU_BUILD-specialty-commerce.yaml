id: EX-WHAT_WOULD_YOU_BUILD-specialty-commerce
type: WHAT_WOULD_YOU_BUILD
title: Trace ecommerce and affiliate obligations — local practical
mode: independent
difficulty: 3
estimated_minutes: 25
skills:
  - SK-BUILD-commerce-affiliates
client: CL-glowhaus-medspa
advanced_topics:
  - specialty.ecommerce
  - specialty.affiliates
allowed_features:
  - GHL-STORE-ECOMMERCE
  - GHL-MKT-AFFILIATES
  - GHL-PAY-PRODUCTS
instructions: Separate checkout, fulfillment, attribution and commission
  approval using a supplied commerce policy. Work from the fictional policy and
  trace in the named fields. Submit JSON, not prose. Types and array order are
  checked; property order is ignored. No model, external tool, message, account
  change, purchase or public publication executes. Bloomlab AI Off is
  sufficient. A pass proves the supplied contract, not live product competence.
written_fields:
  - key: order
    label: Keep purchase and delivery separate
    help: Payment succeeded; shipment has not been confirmed. Return paid=true,
      fulfilled=false, send_delivered_claim=false.
    rows: 6
  - key: commission
    label: Apply the supplied commission policy
    help: A $100 sale earns 10% only if not refunded. This sale was fully refunded.
      Return eligible_cents=0, pay_now=false, attribution_is_payout=false.
    rows: 6
fixture_checks:
  - key: order
    field: order
    expected_json: '{"paid":true,"fulfilled":false,"send_delivered_claim":false}'
  - key: commission
    field: commission
    expected_json: '{"eligible_cents":0,"pay_now":false,"attribution_is_payout":false}'
expected_outcomes:
  - id: order
    type: state
    path: fixture.order
    operator: equals
    value: true
    description: Keep purchase and delivery separate satisfies the supplied contract.
  - id: commission
    type: state
    path: fixture.commission
    operator: equals
    value: true
    description: Apply the supplied commission policy satisfies the supplied contract.
grading:
  mode: deterministic
  pass_threshold: 100
