id: EX-FUNNEL_ASSEMBLY-summit-application
type: FUNNEL_ASSEMBLY
title: Build the application and qualification path
mode: independent
difficulty: 3
estimated_minutes: 55
skills:
  - SK-BUILD-lead-capture-form
  - SK-BUILD-consultation-calendar
  - SK-BUILD-conversion-copy
scenario: SC-summit-application-build
instructions: Summit receives applications for coaching but needs to distinguish readiness before
  inviting a call. In the Funnel Lab, assemble the Coaching Application, Readiness Review and
  Consultation calendar into a customer path. Explain the offer and proof before collecting
  information; capture the lead, qualify, then book. Add a confirmation step that makes the next
  action clear. Connect the real form, survey and calendar from this account. Test a new application
  and a repeat submission. The simulator models the conversion architecture; native GHL page styling
  belongs in manual fieldwork. No checkout belongs on this free discovery path.
allowed_features:
  - GHL-FUNNEL-FUNNELS
  - GHL-FORM-FORMS
  - GHL-FORM-SURVEYS
  - GHL-CAL-CALENDARS
starting_state:
  notes:
    The account has the form, the survey, the calendar, the product and the welcome workflow. It
    has no funnel.
expected_outcomes:
  - id: a1
    type: architecture
    requirement: funnel_step_exists
    purpose: capture
    dimension: architecture
    description: The funnel has a step whose job is to capture the visitor's details.
  - id: a2
    type: architecture
    requirement: funnel_step_exists
    purpose: booking
    dimension: architecture
    description: The funnel has a step whose job is to get a time on the calendar.
  - id: a3
    type: architecture
    requirement: funnel_step_order
    before: capture
    after: booking
    dimension: architecture
    description: Capture comes before booking — Summit keeps the lead even if the visitor never picks a time.
  - id: a4
    type: architecture
    requirement: funnel_reference_connected
    role: form
    dimension: correctness
    description: A form block is connected to a real form in this account.
  - id: a5
    type: architecture
    requirement: funnel_reference_connected
    role: calendar
    dimension: correctness
    description: A calendar block is connected to a real calendar in this account.
  - id: a6
    type: architecture
    requirement: funnel_block_order
    before: outcome
    after: form
    dimension: correctness
    description: The visitor is told what they get before the funnel asks for their details.
  - id: a7
    type: architecture
    requirement: funnel_block_exists
    role: proof
    dimension: architecture
    tier: quality
    description: Somewhere in the funnel there is a reason to believe it.
  - id: a8
    type: architecture
    requirement: funnel_block_order
    before: headline
    after: cta
    dimension: correctness
    tier: quality
    description: The page says what it is before it asks.
  - id: a9
    type: architecture
    requirement: funnel_step_count_max
    value: 4
    dimension: maintainability
    tier: quality
    description: Four steps or fewer — a free consultation does not need a long funnel.
  - id: qualification
    type: architecture
    requirement: funnel_reference_connected
    role: survey
    description: Qualification connects to a real account survey.
  - id: qualification_step
    type: architecture
    requirement: funnel_step_exists
    purpose: content
    description: The path has a qualification decision.
  - id: qualify_before_booking
    type: architecture
    requirement: funnel_step_order
    before: content
    after: booking
    description: Qualification precedes booking.
  - id: capture_before_qualify
    type: architecture
    requirement: funnel_step_order
    before: capture
    after: content
    description: Capture retains the lead before qualification.
  - id: confirmation
    type: architecture
    requirement: funnel_step_exists
    purpose: confirmation
    description: The completed path confirms the next action.
  - id: submission
    type: event
    event: form.submitted
    count:
      min: 2
    description: Test new and repeat form submissions.
critical_failures:
  - id: c1
    type: architecture
    requirement: funnel_block_absent
    role: checkout
    description: The membership is not sold on this funnel; the consultation is free.
grading:
  mode: deterministic
  weights:
    correctness: 40
    edge_cases: 0
    architecture: 40
    maintainability: 20
    explanation: 0
  pass_threshold: 100
hints: []
fieldwork: null
portfolio: null
