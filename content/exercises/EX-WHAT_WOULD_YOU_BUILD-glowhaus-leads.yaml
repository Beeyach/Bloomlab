instructions: |
  Priya says: "We get leads from Meta ads, people fill out the form, half never book, reception
  forgets to follow up, and booked consultations keep no-showing."

  Say what is happening, what you still need to know, where the likely bottleneck is, what you
  would build first, and what you would deliberately not build yet. Several answers are
  defensible; an answer that automates everything on day one is not.
