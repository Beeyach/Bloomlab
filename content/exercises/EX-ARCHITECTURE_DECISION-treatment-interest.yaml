# ARCHITECTURE DECISION (spec §27): tag vs custom field vs custom value vs opportunity field.
id: EX-ARCHITECTURE_DECISION-treatment-interest
type: ARCHITECTURE_DECISION
title: Where does "treatment interest" live?
mode: practice
difficulty: 2
estimated_minutes: 10
skills:
  - SK-ARCHITECT-tags-vs-custom-fields
client: CL-glowhaus-medspa
instructions: |
  Glowhaus's Meta lead form asks which treatment the lead is interested in: Signature Facial,
  Membership, or Laser. Reminder texts should mention it, and Priya wants to see it on the
  contact.

  Decide where the fact lives — tag, contact custom field, custom value, or opportunity field —
  and write two sentences defending the choice, including what would go wrong with the runner-up.
allowed_features:
  - GHL-CRM-TAGS
  - GHL-CRM-CUSTOM-FIELDS
  - GHL-CRM-CUSTOM-VALUES
starting_state: {}
expected_outcomes:
  - id: a1
    type: state
    path: decision.choice
    operator: equals
    value: contact_custom_field
    description: A single changing value per contact is a contact custom field.
  - id: a2
    type: state
    path: decision.reasoning_mentions
    operator: contains
    value: merge_field
    description: The reasoning notes that templates need to print the value.
critical_failures: []
grading:
  mode: mixed
  rubric: SYSTEM_DESIGN_RUBRIC_V1
  pass_threshold: 70
# The architectures the instructions offer at this level (EXR-009 removes them at later levels).
decision_options:
  - value: tag
    label: Tag
  - value: contact_custom_field
    label: Contact custom field
  - value: custom_value
    label: Custom value
  - value: opportunity_field
    label: Opportunity field
# Phrases that count as naming the fact each marker describes. Never shown to the learner; they
# decide one authored deterministic check, not the quality of the argument.
response_markers:
  merge_field:
    - merge field
    - merge fields
    - '{{'
    - template
    - templates
hints:
  - level: nudge
    text: Is "interested in Laser" something that happened, or a value that can change?
  - level: concept_reminder
    text: Three tags for one question is a value pretending to be three events.
fieldwork: null
portfolio: null
