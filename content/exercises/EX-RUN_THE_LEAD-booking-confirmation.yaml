id: EX-RUN_THE_LEAD-booking-confirmation
type: RUN_THE_LEAD
title: Run Maria through the booking confirmation
mode: guided
difficulty: 1
estimated_minutes: 10
skills:
  - SK-AUTOMATE-workflow-foundations
scenario: SC-glowhaus-no-show
instructions: |
  Maria books a consultation for tomorrow at 3 pm.

  Before running anything, write down: which workflow enrolls her, what message she receives,
  and which tag she has afterwards. Then run her through and compare your prediction with the
  execution log.
allowed_features:
  - GHL-WF-CUSTOMER-BOOKED-APPOINTMENT
  - GHL-WF-SEND-SMS
  - GHL-WF-ADD-CONTACT-TAG
starting_state:
  contact_id: maria
expected_outcomes:
  - id: a1
    type: event
    event: sms.sent
    count:
      exactly: 1
    where:
      contact_id: maria
    description: One confirmation text is sent.
  - id: a2
    type: sequence
    before: sms.sent
    after: tag.added
    description: The text goes out before the booked tag is added, as the workflow is ordered.
  - id: a3
    type: state
    path: prediction.tag
    operator: equals
    value: booked
    description: The learner predicted the booked tag.
critical_failures: []
grading:
  mode: deterministic
  pass_threshold: 70
hints:
  - level: nudge
    text: Read the actions top to bottom. The order in the builder is the order in the log.
fieldwork: null
portfolio: null
topics:
  - workflow.foundations
  - workflow.triggers
  - workflow.filters
  - workflow.actions
  - workflow.communications
