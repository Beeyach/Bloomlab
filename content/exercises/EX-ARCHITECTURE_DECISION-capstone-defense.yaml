id: EX-ARCHITECTURE_DECISION-capstone-defense
type: ARCHITECTURE_DECISION
title: Defend the system you delivered
skills:
  - SK-JUDGMENT-automation-appropriateness
  - SK-DELIVER-client-explanation
instructions: Use your own saved engagement work and manual GHL proof. Answer all eight questions
  with the actual design decision, evidence and remaining limitation. Do not describe an ideal
  system you did not build. Where something is unverified, state how you would verify it before
  promising it. This is an independent defense, with no normal hints or automatic drafting.
mode: pressure
difficulty: 4
estimated_minutes: 40
client: CL-glowhaus-medspa
expected_outcomes:
