id: EX-EDGE_CASE-no-show-missing-phone
type: EDGE_CASE
title: The no-show with no phone number
mode: pressure
difficulty: 3
estimated_minutes: 15
skills:
  - SK-AUTOMATE-no-show-recovery
scenario: SC-glowhaus-no-show
instructions: |
  Your no-show recovery workflow is live. Jordan Pike books, does not show, and has **no phone
  number** on the contact record.

  Does the system still work? Run Jordan through it, then fix whatever breaks so that Jordan is
  still reached and the front desk still knows.
allowed_features:
  - GHL-WF-APPOINTMENT-STATUS
  - GHL-WF-SEND-SMS
  - GHL-WF-SEND-EMAIL
  - GHL-WF-IF-ELSE
  - GHL-WF-SEND-INTERNAL-NOTIFICATION
starting_state:
  contact_id: jordan
expected_outcomes:
  - id: a1
    type: event
    event: email.sent
    count:
      exactly: 1
    where:
      contact_id: jordan
      purpose: rebooking
    description: Jordan receives the rebooking message by email instead.
  - id: a2
    type: event
    event: notification.sent
    count:
      min: 1
    where:
      contact_id: jordan
    description: The front desk is still notified.
critical_failures:
  - id: c1
    type: negative
    event: action.skipped
    where:
      contact_id: jordan
      action: GHL-WF-SEND-SMS
    description: The workflow must not attempt an SMS to a contact without a phone.
grading:
  mode: deterministic
  weights:
    correctness: 50
    edge_cases: 30
    architecture: 10
    maintainability: 5
    explanation: 5
  pass_threshold: 80
hints: []
fieldwork: null
portfolio: null
