id: EX-ARCHITECTURE_DECISION-professional-judgment
type: ARCHITECTURE_DECISION
title: Fourteen decisions before you commit
skills:
  - SK-JUDGMENT-automation-appropriateness
instructions: Respond to each brief with a decision, the evidence supporting it, the limit of your
  knowledge and the next verification step. These are separate service-business situations, not
  facts from one account. Do not invent native features, client approval or guaranteed outcomes. No
  automatic drafting is offered.
