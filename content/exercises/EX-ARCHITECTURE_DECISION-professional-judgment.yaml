hints: []
written_fields:
  - key: funnel_needed
    label: A cleaner has no enquiries
    help:
      Traffic is twenty visitors a month, and the existing enquiry form works. Would you build a new
      funnel, and what would you investigate first?
    rows: 4
  - key: automation_needed
    label: One unusual complaint
    help: The owner wants a workflow for a once-a-year dispute requiring personal judgment. Decide
      whether automation adds value.
    rows: 4
  - key: ghl_appropriate
    label: Clinical treatment records
    help: A therapist wants sensitive treatment histories and complex clinical records in the same
      marketing contact record. Decide the system boundary and what expertise is missing.
    rows: 4
  - key: data_choice
    label: Pet, owner and company
    help:
      A veterinary clinic needs multiple pets per owner and corporate billing. Choose tags, typed
      fields, account values, relationships or another system for each fact.
    rows: 4
  - key: custom_code
    label: A standard booking page
    help:
      The client requests custom code before trying the supported booking controls. What evidence
      would justify code and who maintains it?
    rows: 4
  - key: contact_prospect
    label: No capacity to respond
    help:
      A roofer is fully booked, declines more enquiries and has a working intake. Should Bloomwired
      contact them about lead capture now?
    rows: 4
  - key: audit_evidence
    label: One delayed response
    help:
      One test enquiry waited a day. State what is verified, what is not, and the next authorised
      test.
    rows: 4
  - key: accept_project
    label: An impossible promise
    help: The client requires guaranteed doubling of sales and refuses access to the current system.
      Decide whether to accept and under what changed terms.
    rows: 4
  - key: scope
    label: Two locations by Friday
    help: The signed scope covers one location. Decide what is feasible before promising the second.
    rows: 4
  - key: price
    label: Below estimated delivery cost
    help: The proposed fee does not cover build and QA. Explain a revised scope, price or refusal
      without inventing a universal market rate.
    rows: 4
  - key: complexity
    label: Six branches for one difference
    help: Only the message copy changes between two services. Explain whether the branching plan is
      justified and what simpler design you would test.
    rows: 4
  - key: uncertainty
    label: An undocumented native feature
    help:
      You have not verified whether the account supports the requested behaviour. Write the client
      answer and the verification plan.
    rows: 4
  - key: what_breaks
    label: Missing phone at late booking
    help:
      An appointment starts in fifteen minutes and has no phone number. Identify what could fail and
      how you would test the fallback.
    rows: 4
  - key: missing_verification
    label: A confident launch request
    help: Desktop happy-path tests pass, but mobile and rescheduling were not tested. State what is
      missing and the release decision.
    rows: 4
