id: EX-BUILD_IT-no-show-recovery
type: BUILD_IT
title: Build Glowhaus's no-show recovery
mode: guided
difficulty: 3
estimated_minutes: 40
skills:
  - SK-AUTOMATE-no-show-recovery
  - SK-ARCHITECT-pipeline-design
  - SK-AUTOMATE-workflow-foundations
scenario: SC-glowhaus-no-show
instructions: |
  Two of every five booked consultations at Glowhaus never happen, and nobody follows up.

  Build a workflow that starts when an appointment is marked **No-show** and, for that contact:

  1. sends one rebooking text within a few minutes, with the booking link;
  2. moves their opportunity in the Consultations pipeline to **Lost** if they have not rebooked
     within three days;
  3. tells Dana (front desk) by internal notification so a human can call.

  Contacts without a phone number must still be reached. Contacts who opted out (DND) must not be
  texted. A contact whose appointment was **cancelled** — not no-showed — must not enter this
  workflow at all.
allowed_features:
  - GHL-WF-APPOINTMENT-STATUS
  - GHL-WF-SEND-SMS
  - GHL-WF-SEND-EMAIL
  - GHL-WF-IF-ELSE
  - GHL-WF-WAIT
  - GHL-WF-CREATE-UPDATE-OPPORTUNITY
  - GHL-WF-SEND-INTERNAL-NOTIFICATION
  - GHL-WF-UPDATE-CONTACT-FIELD
  - GHL-WF-ADD-CONTACT-TAG
  - GHL-WF-REMOVE-FROM-WORKFLOW
starting_state:
  notes: The booking confirmation workflow already exists and works. Leave it alone.
expected_outcomes:
  - id: a1
    type: architecture
    requirement: trigger_exists
    ghl_feature: GHL-WF-APPOINTMENT-STATUS
    description: The workflow starts from the Appointment Status trigger.
  - id: a2
    type: event
    event: sms.sent
    count:
      exactly: 1
    where:
      contact_id: maria
      purpose: rebooking
    description: Maria (no-show, has a phone) receives exactly one rebooking text.
  - id: a3
    type: timing
    event: sms.sent
    relative_to: appointment.no_show
    offset_minutes: 0
    tolerance_minutes: 15
    description: The rebooking text goes out within fifteen minutes of the no-show.
  - id: a4
    type: event
    event: notification.sent
    count:
      min: 1
    where:
      contact_id: maria
    description: The front desk is notified.
  - id: a5
    type: state
    path: opportunities.opp-maria.stage
    operator: equals
    value: Lost
    description: After three days without a rebooking, Maria's opportunity is Lost.
  - id: a6
    type: architecture
    requirement: branch_exists
    ghl_feature: GHL-WF-IF-ELSE
    description: A branch handles contacts who cannot be texted.
critical_failures:
  - id: c1
    type: negative
    event: sms.sent
    where:
      contact_id: lena
    description: Lena is on DND and must never be texted.
  - id: c2
    type: negative
    event: workflow.enrolled
    where:
      contact_id: maria
      trigger_appointment_status: cancelled
    description: A cancelled appointment must not enter the recovery workflow.
grading:
  mode: deterministic
  weights:
    correctness: 45
    edge_cases: 20
    architecture: 15
    maintainability: 10
    explanation: 10
  pass_threshold: 70
hints:
  - level: nudge
    text:
      Which trigger knows that an appointment became a No-show, and what filter narrows it to that
      status?
  - level: concept_reminder
    text:
      Cancelled and No-show are two different statuses on the same trigger. Filter on the status,
      not on a tag you add afterwards.
  - level: worked_example
    text: |
      Trigger **Appointment Status** filtered to *No-show* → **If/Else** on `contact.phone`
      exists → yes: **Send SMS** with `{{custom_values.booking_link}}`; no: **Send Email** →
      **Send Internal Notification** to Dana → **Wait** 3 days → **If/Else** on a `rebooked`
      tag → no: **Create/Update Opportunity** stage *Lost*.
fieldwork: null
portfolio: PF-consultation-booking-system
topics:
  - workflow.foundations
  - workflow.triggers
  - workflow.filters
  - workflow.actions
  - workflow.waits
  - workflow.branching
  - workflow.timing
  - workflow.pipeline_automation
  - workflow.common_systems
