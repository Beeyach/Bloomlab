id: CAMP-GHL_AI_SPECIALIST
title: GHL AI Specialist
pace_hint: Post-Field-Ready · progress by evidence, at your own pace
summary: Apply deterministic-first judgment to customer AI, workflow actions, agent knowledge
  and least-privilege external tools.
requires_campaigns:
  - CAMP-FIELD_READY
  - CAMP-CONNECT_FOUNDATIONS
post_field_ready: true
recommended: false
gates:
