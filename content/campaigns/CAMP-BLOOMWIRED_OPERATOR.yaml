id: CAMP-BLOOMWIRED_OPERATOR
title: Bloomwired Operator Path
pace_hint: Post-Field-Ready · progress by evidence, at your own pace
summary: 'The recommended broad operator continuation: reliable account behavior, accountable
  client work and reusable vertical demonstrations before optional specialization.'
requires_campaigns:
  - CAMP-FIELD_READY
  - CAMP-CONNECT_FOUNDATIONS
post_field_ready: true
recommended: true
gates:
