id: CAMP-FIELD_READY
title: Field Ready
pace_hint: 'Suggested pace: ~30 days at 3–5 hours/day'
summary: 'From placement to a capstone the learner performs partly in real GHL: funnel thinking,
  lead systems, data foundations, workflows, booking, conversion, diagnosis, prospecting, selling,
  pricing, delivery. Passing means capable, not expert.'
requires_campaigns: []
gates:
  - id: GATE-0
    number: 0
    name: Placement
    summary: Discover what the learner can already do; strong basics clear early requirements.
    placement: true
    skills: []
    assesses:
      - SK-STRATEGIZE-funnel-math
      - SK-BUILD-lead-capture-form
      - SK-AUTOMATE-workflow-foundations
      - SK-ARCHITECT-tags-vs-custom-fields
      - SK-ARCHITECT-pipeline-design
      - SK-SELL-project-pricing
      - SK-SELL-written-prospect-response
      - SK-SELL-discovery-call
    pass_criteria:
      independent_evidence_per_skill: 1
      notes: Placement never blocks; it only clears what is already demonstrated.
  - id: GATE-1
    number: 1
    name: Funnel Thinking
    summary: Customer journey, funnel purpose, offers, friction, conversion and funnel math.
    skills:
      - SK-STRATEGIZE-funnel-math
      - SK-STRATEGIZE-bottleneck-diagnosis
    pass_criteria:
      independent_evidence_per_skill: 2
      pressure_test_required: true
  - id: GATE-2
    number: 2
    name: Lead Systems
    summary: Lead capture, forms, confirmation, follow-up, CRM capture, next action.
    skills:
      - SK-BUILD-lead-capture-form
    pass_criteria:
      independent_evidence_per_skill: 2
      fieldwork_required: true
    projects:
      - PRJ-lead-capture-system
  - id: GATE-3
    number: 3
    name: GHL Data Foundations
    summary: Contacts, tags, custom fields, custom values, opportunities, pipelines.
    skills:
      - SK-ARCHITECT-tags-vs-custom-fields
      - SK-ARCHITECT-pipeline-design
      - SK-ARCHITECT-custom-values
    pass_criteria:
      independent_evidence_per_skill: 2
      pressure_test_required: true
    projects:
      - PRJ-lead-capture-system
  - id: GATE-4
    number: 4
    name: Workflow Foundations
    summary: Triggers, filters, actions, waits, If/Else, re-entry, timing.
    skills:
      - SK-AUTOMATE-workflow-foundations
      - SK-AUTOMATE-reentry-and-duplicates
      - SK-JUDGMENT-automation-appropriateness
    pass_criteria:
      independent_evidence_per_skill: 2
      pressure_test_required: true
      fieldwork_required: true
    projects:
      - PRJ-reactivation-system
  - id: GATE-5
    number: 5
    name: Booking and Qualification
    summary: Calendars, reminders, cancellations, reschedules, no-shows.
    skills:
      - SK-BUILD-consultation-calendar
      - SK-AUTOMATE-appointment-reminders
      - SK-AUTOMATE-no-show-recovery
    pass_criteria:
      independent_evidence_per_skill: 2
      pressure_test_required: true
      fieldwork_required: true
    projects:
      - PRJ-consultation-booking-system
  - id: GATE-6
    number: 6
    name: Conversion and Copy
    summary: Page hierarchy, message match, CTA placement, conversion copy, proof, mobile conversion design.
    skills:
      - SK-BUILD-conversion-copy
    pass_criteria:
      independent_evidence_per_skill: 2
      notes: Curriculum for this gate is authored in Phase 24.
    projects:
      - PRJ-application-funnel-proposal
  - id: GATE-7
    number: 7
    name: Diagnosis and QA
    summary: Workflow and funnel troubleshooting, logs, edge cases, pre-launch QA.
    skills:
      - SK-DIAGNOSE-workflow-troubleshooting
    pass_criteria:
      independent_evidence_per_skill: 3
      pressure_test_required: true
    projects:
      - PRJ-field-ready-capstone
  - id: GATE-8
    number: 8
    name: Prospecting and Audits
    summary: ICP, prospect selection, evidence, research, outreach, audit quality.
    skills:
      - SK-SELL-evidence-based-audit
      - SK-SELL-prospect-selection
      - SK-SELL-written-prospect-response
    pass_criteria:
      independent_evidence_per_skill: 2
      pressure_test_required: true
    projects:
      - PRJ-field-ready-capstone
  - id: GATE-9
    number: 9
    name: Discovery and Selling
    summary: Discovery calls, listening, diagnosis, explaining systems, pitching outcomes.
    skills:
      - SK-SELL-discovery-call
      - SK-DELIVER-client-explanation
    pass_criteria:
      independent_evidence_per_skill: 2
      pressure_test_required: true
    projects:
      - PRJ-field-ready-capstone
  - id: GATE-10
    number: 10
    name: Pricing and Negotiation
    summary: Scope, fixed and recurring pricing, deposits, negotiation, walking away.
    skills:
      - SK-SELL-project-pricing
      - SK-SELL-negotiation-basics
    pass_criteria:
      independent_evidence_per_skill: 2
      pressure_test_required: true
    projects:
      - PRJ-application-funnel-proposal
  - id: GATE-11
    number: 11
    name: Proposal and Delivery
    summary: Proposal, acceptance, onboarding, build order, client updates, handoff.
    skills:
      - SK-DELIVER-proposal-writing
    pass_criteria:
      independent_evidence_per_skill: 2
    projects:
      - PRJ-reactivation-system
  - id: GATE-12
    number: 12
    name: Field Ready Capstone
    summary: Complete the five practical project records, including the independent eleven-stage
      capstone and manual real-GHL evidence. This gate evaluates saved project work rather than
      duplicating capabilities already assessed in Gates 1–11.
    skills: []
    pass_criteria:
      independent_evidence_per_skill: 1
      pressure_test_required: true
      fieldwork_required: true
      notes: The capstone project (Full Bloomwired Client) is authored in Phase 24.
    projects:
      - PRJ-lead-capture-system
      - PRJ-consultation-booking-system
      - PRJ-application-funnel-proposal
      - PRJ-reactivation-system
      - PRJ-field-ready-capstone
    projects_required: true
coverage_enforced: true
completion:
  statement: Field Ready means you can deliver bounded, common Bloomwired systems and explain your
    decisions. Keep scope within your demonstrated capability, verify uncertainty and involve
    appropriate help when the work exceeds it. This certificate records training evidence; it does
    not guarantee client outcomes.
  capabilities:
    - Diagnose common Bloomwired business problems.
    - Implement core funnel, lead, booking and GHL systems.
    - Troubleshoot common workflow and funnel failures.
    - Speak with prospects and conduct useful discovery.
    - Write clear sales and client communications.
    - Scope and price common implementation work.
    - Negotiate basic objections and protect responsible scope.
    - Complete selected real-GHL fieldwork with manual proof.
    - Recognize the limits of your competence and verify what you do not yet know.
future_boundaries:
  - territory: STRATEGIZE
    tier: practitioner
    topics:
      - webinar
      - evergreen webinar
      - challenge
      - workshop
      - direct purchase
      - checkout
      - order bump
      - upsell
      - downsell
      - subscription
      - trial
      - membership
      - course enrollment
  - territory: STRATEGIZE
    tier: advanced
    topics:
      - multi-funnel architecture
      - lifecycle strategy
      - retention
      - referral
      - churn prevention
      - experimentation
      - advanced diagnosis
  - territory: STRATEGIZE
    tier: specialist
    topics:
      - complete business-system architecture
  - territory: AUTOMATE
    tier: advanced
    topics:
      - modular automation
      - naming
      - workflow responsibility
      - date logic
      - webhooks
      - data manipulation
      - ecommerce automation
      - reliability
      - idempotency concepts
      - race conditions
      - large automation architecture
      - custom workflow extensions later
