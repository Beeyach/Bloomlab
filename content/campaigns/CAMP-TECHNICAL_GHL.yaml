id: CAMP-TECHNICAL_GHL
title: Technical GHL Specialist
pace_hint: Post-Field-Ready · progress by evidence, at your own pace
summary: Connect operator infrastructure, shared-account architecture and governed AI without
  making live providers a training dependency.
requires_campaigns:
  - CAMP-FIELD_READY
  - CAMP-CONNECT_FOUNDATIONS
post_field_ready: true
recommended: false
gates:
