    number: 1
    name: CONNECT foundations
    summary: Complete the nine safe local infrastructure contracts before using more powerful
      interfaces.
    skills:
      - SK-AUTOMATE-workflow-foundations
      - SK-CONNECT-dns
      - SK-CONNECT-json
      - SK-CONNECT-http
      - SK-CONNECT-webhook-payloads
      - SK-CONNECT-ghl-api
      - SK-CONNECT-git
      - SK-CONNECT-workers
      - SK-CONNECT-google-cloud
      - SK-CONNECT-javascript
    pass_criteria:
      independent_evidence_per_skill: 1
      pressure_test_required: false
      fieldwork_required: false
      notes: Gate progress is training evidence, not a new professional certification. Skill mastery
        and real-GHL requirements remain separately visible.
