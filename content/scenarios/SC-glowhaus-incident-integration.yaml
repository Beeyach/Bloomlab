hidden_facts:
  what_the_vendor_says: 'The rota tool has an open incident on its own status page.'
failure_modes: [integration_failure]
incident:
  title: Nothing wrong with the workflow
  symptom: >-
    Rota Sync runs, the webhook step fires, and the response is not a success. The token in the
    header is the one the rota tool issued and the URL is the documented one.
  client_complaint: >-
    "It has stopped again. You fixed this last month, so what have you broken this time?"
  failure_mode: integration_failure
  inspect:
    - The Rota Sync execution log, at the webhook step, and the status it came back with
    - The header the webhook sends, against what the rota endpoint expects
    - Whether anything in this account changed
  reproduce:
    - Run the queued booking.
    - Compare the status and reason with the one you got when a credential was wrong.
