# SIM-011 · integration_failure. The credential is right and the service is down.
#
# The pair to the invalid-auth incident, and the reason both exist: the workflow is configured
# correctly here. The token matches, the URL is right, the payload is right. The rota tool itself
# is returning 503. There is nothing to fix in HighLevel, and saying so is the correct diagnosis.
id: SC-glowhaus-incident-integration
title: Glowhaus — nothing wrong with the workflow
client: CL-glowhaus-medspa
summary: >-
  The same rota sync, the same symptom on the surface, and a different cause. The webhook step is
  configured exactly as the rota tool documents. What comes back is not a 2xx, and the reason is
  on the other side of the wire.
