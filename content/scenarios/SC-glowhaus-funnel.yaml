# The Funnel Lab's training account (Phase 13, FUN-001 … FUN-003). Glowhaus is about to run paid
# traffic to a consultation offer and has nothing to send it to: the account holds the pieces —
# a consultation request form, a qualifying survey, a booking calendar, a membership product and a
# workflow that reacts to a form submission — and no funnel connecting any of them. That is the
# learner's job, and it is why the funnel here is deliberately absent rather than half-built.
#
# The workflow matters as much as the missing funnel. `wf-new-lead-welcome` is triggered by Form
# Submitted on the consultation request form, so a visitor who submits that form inside SIMULATE
# creates a real contact and enrols for real. Nothing stages that chain; the engine's own matcher
# decides it.
id: SC-glowhaus-funnel
title: Glowhaus — traffic with nowhere to land
client: CL-glowhaus-medspa
summary: >-
  Glowhaus is ready to spend on ads for consultations and has no funnel to send that traffic to.
  The account already has the consultation request form, a short qualifying survey, the
  consultation calendar, a membership product and a welcome workflow that fires on a form
  submission. What is missing is the architecture that connects them.
initial_account_state:
  users:
    - id: priya
      name: Priya Raman
      role: admin
  contacts:
    # One contact the account already knows, so the update path can be walked as well as the
    # creation path: submitting a form as Nadia updates her rather than creating a second record.
    - id: nadia
      first_name: Nadia
      last_name: Haddad
      email: nadia.haddad@example.com
      phone: '+15125550188'
      tags: [returning]
      custom_fields:
        treatment_interest: Signature Facial
      timezone: America/Chicago
      source: Returning client
      owner_id: priya
  tags: [returning, new-lead, meta-lead, booked, member]
  custom_fields:
    - key: treatment_interest
      label: Treatment interest
      type: dropdown
      options: [Signature Facial, Membership, Laser]
    - key: budget_band
      label: Budget band
      type: dropdown
      options: ['Under 200', '200 to 500', 'Over 500']
  custom_values:
    - key: front_desk_phone
      value: '+15125550100'
  pipelines:
    - id: consultations
      name: Consultations
      stages: [New Lead, Booked, Showed, Won, Lost]
  calendars:
    - id: consultation
      name: Consultation
      duration_minutes: 30
      timezone: America/Chicago
  forms:
    - id: consult-request
      name: Consultation Request
      fields: [first_name, last_name, email, phone, treatment_interest]
  surveys:
    - id: fit-check
      name: Fit Check
      fields: [treatment_interest, budget_band]
  products:
    - id: glow-membership
      name: Glow Membership
      price: 149
      recurring: true
  workflows:
    - id: wf-new-lead-welcome
      name: New Lead Welcome
      trigger:
        ghl_feature_id: GHL-WF-FORM-SUBMITTED
        filters:
          - field: form
            operator: is
            value: consult-request
      nodes:
        - id: n1
          type: action
          ghl_feature_id: GHL-WF-ADD-CONTACT-TAG
          label: Tag the lead
          config:
            tag: new-lead
          position: { x: 0, y: 120 }
        - id: n2
          type: action
          ghl_feature_id: GHL-WF-SEND-SMS
          label: Welcome text
          config:
            template: 'Hi {{contact.first_name}}, thanks for asking about a consultation at Glowhaus. Pick a time here: https://glowhausaustin.com/book'
            purpose: welcome
          position: { x: 0, y: 240 }
        - id: n3
          type: end
          position: { x: 0, y: 360 }
      edges:
        - { from: n1, to: n2 }
        - { from: n2, to: n3 }
      settings:
        allow_reentry: false
        timezone: America/Chicago
  funnels: []
simulation_time: '2026-09-08T09:00:00-05:00'
timezone: America/Chicago
seed: 5309
scheduled_events: []
injectable_events:
  - id: nadia-books
    type: appointment.booked
    description: Nadia books a consultation for 90 minutes from now, without going through a funnel.
    payload: { contact_id: nadia, calendar_id: consultation, minutes_from_now: 90 }
hidden_facts:
  ad_spend_planned_monthly: 1200
  consultations_wanted_monthly: 20
  front_desk_reply_delay_hours: 26
failure_modes:
  - missing_field
  - duplicate_contact
