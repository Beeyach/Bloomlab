# Simulator starting state (spec §40, §49): Glowhaus with a working booking confirmation and
# nothing after it. Used by the no-show recovery BUILD IT and its EDGE CASE variants.
id: SC-glowhaus-no-show
title: Glowhaus — consultations that quietly no-show
client: CL-glowhaus-medspa
summary: >-
  Consultations are booked on the Consultation calendar and confirmed by SMS, then nothing
  happens until the appointment. Two of five booked leads do not show, and nobody follows up.
initial_account_state:
  users:
    - id: dana
      name: Dana Whitfield
      role: user
  contacts:
    - id: maria
      first_name: Maria
      last_name: Delgado
      email: maria.delgado@example.com
      phone: '+15125550142'
      tags: [meta-lead]
      custom_fields:
        treatment_interest: Signature Facial
      timezone: America/Chicago
      source: Meta lead ad
    - id: jordan
      first_name: Jordan
      last_name: Pike
      email: jordan.pike@example.com
      tags: [meta-lead]
      custom_fields:
        treatment_interest: Membership
      source: Meta lead ad
    - id: lena
      first_name: Lena
      last_name: Ortiz
      email: lena.ortiz@example.com
      phone: '+15125550177'
      tags: [walk-in]
      dnd: true
  tags: [meta-lead, walk-in, booked, no-show, rebooked]
  custom_fields:
    - key: treatment_interest
      label: Treatment interest
      type: dropdown
      options: [Signature Facial, Membership, Laser]
    - key: consult_outcome
      label: Consult outcome
      type: dropdown
      options: [Booked, Thinking about it, Not a fit]
  custom_values:
    - key: front_desk_phone
      value: '+15125550100'
    - key: booking_link
      value: https://glowhausaustin.com/book
  pipelines:
    - id: consultations
      name: Consultations
      stages: [New Lead, Booked, Showed, Won, Lost]
  opportunities:
    - id: opp-maria
      contact_id: maria
      pipeline_id: consultations
      stage: Booked
      value: 410
    - id: opp-jordan
      contact_id: jordan
      pipeline_id: consultations
      stage: Booked
      value: 149
  calendars:
    - id: consultation
      name: Consultation
      duration_minutes: 30
      timezone: America/Chicago
  appointments:
    - id: appt-maria
      contact_id: maria
      calendar_id: consultation
      starts_at: '2026-09-04T15:00:00-05:00'
    - id: appt-jordan
      contact_id: jordan
      calendar_id: consultation
      starts_at: '2026-09-04T16:00:00-05:00'
  forms:
    - id: consult-request
      name: Consultation Request
      fields: [first_name, phone, email, treatment_interest]
  workflows:
    - id: wf-booking-confirmation
      name: Booking Confirmation
      trigger:
        ghl_feature_id: GHL-WF-CUSTOMER-BOOKED-APPOINTMENT
        filters:
          - field: calendar
            operator: is
            value: consultation
      nodes:
        - id: n1
          type: action
          ghl_feature_id: GHL-WF-SEND-SMS
          label: Confirmation SMS
          config:
            template: "Hi {{contact.first_name}}, you're booked at Glowhaus on {{appointment.start_time}}. Reply CHANGE to reschedule."
            purpose: confirmation
          position: { x: 0, y: 120 }
        - id: n2
          type: action
          ghl_feature_id: GHL-WF-ADD-CONTACT-TAG
          config:
            tag: booked
          position: { x: 0, y: 240 }
        - id: n3
          type: end
          position: { x: 0, y: 360 }
      edges:
        - { from: n1, to: n2 }
        - { from: n2, to: n3 }
      settings:
        allow_reentry: true
        timezone: America/Chicago
simulation_time: '2026-09-03T09:00:00-05:00'
timezone: America/Chicago
seed: 4021
scheduled_events:
  - at: '2026-09-04T15:35:00-05:00'
    type: appointment.status_changed
    payload: { appointment_id: appt-maria, status: no_show }
    description: Maria does not arrive; Dana marks the appointment No-show 35 minutes in.
  - at: '2026-09-04T16:05:00-05:00'
    type: appointment.status_changed
    payload: { appointment_id: appt-jordan, status: showed }
injectable_events:
  - id: maria-cancels
    type: appointment.status_changed
    description: Maria cancels the evening before instead of no-showing.
    payload: { appointment_id: appt-maria, status: cancelled }
  - id: jordan-books-late
    type: appointment.booked
    description: Jordan books a second consultation for 40 minutes from now.
    payload: { contact_id: jordan, calendar_id: consultation, minutes_from_now: 40 }
hidden_facts:
  reception_follow_up_delay_hours: 30
  no_show_rate_last_quarter: 0.42
  second_location_planned: true
failure_modes:
  - missing_phone
  - dnd
  - cancelled_appointment
  - late_booking
  - duplicate_enrollment
