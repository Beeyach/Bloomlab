# SIM-011 · missing_field. Valid data, incomplete data, wrong outcome.
#
# The field exists, the branch is written correctly, and the workflow runs to the end. What is
# missing is the value: leads who come through the short campaign form never answer the treatment
# question, so the branch that looks at it takes its fallback and everyone gets the generic email.
# Nothing here is a schema error, which is the point — a validator would pass this.
id: SC-glowhaus-incident-missing-field
title: Glowhaus — everyone gets the same email
client: CL-glowhaus-medspa
summary: >-
  Leads from the campaign form are all being sent the general enquiry email, including the ones
  who came in about laser. The routing branch is written correctly and the field it reads exists.
initial_account_state:
  users:
    - { id: priya, name: Priya Raman, role: admin }
  contacts: []
  tags: [new-lead, laser-interest]
  custom_fields:
    - key: treatment_interest
      label: Treatment interest
      type: dropdown
      options: [Signature Facial, Membership, Laser]
  forms:
    # The campaign form is the short one, built for a paid ad. It never asks the treatment
    # question, so the field is empty on every lead it creates.
    - id: campaign-form
      name: Laser Campaign Form
      fields: [first_name, last_name, email, phone]
    - id: consult-request
      name: Consultation Request
      fields: [first_name, last_name, email, phone, treatment_interest]
  workflows:
    - id: wf-route-by-interest
      name: Route By Interest
      trigger:
        ghl_feature_id: GHL-WF-FORM-SUBMITTED
        filters: []
      nodes:
        - id: n1
          type: branch
          ghl_feature_id: GHL-WF-IF-ELSE
          label: What are they here for?
          config:
            branches:
              - name: laser
                groups:
                  - conditions:
                      - {
                          field: contact.custom_fields.treatment_interest,
                          operator: is,
                          value: Laser,
                        }
              - name: membership
                groups:
                  - conditions:
                      - {
                          field: contact.custom_fields.treatment_interest,
                          operator: is,
                          value: Membership,
                        }
          position: { x: 0, y: 120 }
        - id: n2
          type: action
          ghl_feature_id: GHL-WF-SEND-EMAIL
          label: Laser consultation email
          config:
            {
              subject: 'Your laser consultation',
              body: 'Hi {{contact.first_name}}, here is what to expect from a laser consultation, including the patch test.',
            }
          position: { x: -200, y: 260 }
        - id: n3
          type: action
          ghl_feature_id: GHL-WF-SEND-EMAIL
          label: Membership email
          config:
            {
              subject: 'About the Glow Membership',
              body: 'Hi {{contact.first_name}}, here is what the membership covers.',
            }
          position: { x: 0, y: 260 }
        - id: n4
          type: action
          ghl_feature_id: GHL-WF-SEND-EMAIL
          label: General enquiry email
          config:
            {
              subject: 'Thanks for getting in touch',
              body: 'Hi {{contact.first_name}}, someone from the studio will be in touch shortly.',
            }
          position: { x: 200, y: 260 }
        - { id: n5, type: end, position: { x: 0, y: 400 } }
      edges:
        - { from: n1, to: n2, branch: laser }
        - { from: n1, to: n3, branch: membership }
        - { from: n1, to: n4 }
        - { from: n2, to: n5 }
        - { from: n3, to: n5 }
        - { from: n4, to: n5 }
      settings: { allow_reentry: false, timezone: America/Chicago }
simulation_time: '2026-09-07T09:00:00-05:00'
timezone: America/Chicago
seed: 4104
