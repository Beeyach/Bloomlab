  - at: '2026-09-07T10:05:00-05:00'
    type: form.submitted
    payload:
      form_id: campaign-form
      contact_id: yusuf
      values:
        {
          first_name: Yusuf,
          last_name: Karim,
          email: 'yusuf.karim@example.com',
          phone: '+15125550133',
        }
    description: Yusuf answers the laser ad and fills in the campaign form
  - at: '2026-09-07T11:40:00-05:00'
    type: form.submitted
    payload:
      form_id: consult-request
      contact_id: petra
      values:
        {
          first_name: Petra,
          last_name: Nowak,
          email: 'petra.nowak@example.com',
          phone: '+15125550134',
          treatment_interest: Laser,
        }
    description: Petra fills in the full consultation form instead
injectable_events:
  - id: campaign-lead
    type: form.submitted
    description: Send another lead through the campaign form and watch which branch it takes.
    payload:
      form_id: campaign-form
      contact_id: test-campaign
      values:
        {
          first_name: Test,
          last_name: Campaign,
          email: 'test.campaign@example.com',
          phone: '+15125550135',
        }
hidden_facts:
  ad_promise: 'The ad this form sits under is entirely about laser.'
failure_modes: [missing_field]
incident:
  title: Everyone gets the same email
  symptom: >-
    Two leads came in about laser on the same morning. One got the laser email and one got the
    general enquiry email. The branch that decides between them evaluated correctly in both cases.
  client_complaint: >-
    "We are paying for laser ads and the people who click them get an email that does not mention
    laser once. The ones who find us on Google get the right one. Why?"
  failure_mode: missing_field
  inspect:
    - The branch result in the execution log, for both leads, and what it compared
    - Yusuf's contact record beside Petra's
    - The fields each of the two forms collects
  reproduce:
    - Run both queued submissions.
    - Read the branch comparison rather than the branch that was taken. The condition is right;
      look at what it had to work with.
