# SIM-011 · invalid_webhook_auth. The credential is wrong, and the service says so.
#
# Bloomlab makes no request. `external_endpoints` is the scenario's own deterministic answer for
# one exact URL — training simulation, not a HighLevel field, and every screen that shows it says
# so. What is real is the Custom Webhook action's own configuration: it carries
# headers, including Authorization, and this workflow sends one with last season's token in it.
id: SC-glowhaus-incident-webhook-auth
title: Glowhaus — the booking sync that stopped syncing
client: CL-glowhaus-medspa
summary: >-
  Every consultation is supposed to reach the studio's rota tool through a webhook. Nothing has
  arrived there for a fortnight. The workflow runs, the step is in its history, and the response
  it got back is the answer.
initial_account_state:
  users:
    - { id: priya, name: Priya Raman, role: admin }
  contacts:
    - id: dev
      first_name: Dev
      last_name: Ramanathan
      email: 'dev.r@example.com'
      phone: '+15125550171'
      timezone: America/Chicago
      source: Walk-in
      owner_id: priya
  tags: [booked]
  calendars:
    - id: consultation
      name: Consultation
      type: personal
      duration_minutes: 30
      slot_interval_minutes: 30
      minimum_notice_minutes: 60
      timezone: America/Chicago
      staff_ids: [priya]
      availability:
        - { day: 1, start: '09:00', end: '17:00' }
        - { day: 2, start: '09:00', end: '17:00' }
        - { day: 3, start: '09:00', end: '17:00' }
        - { day: 4, start: '09:00', end: '17:00' }
        - { day: 5, start: '09:00', end: '17:00' }
  external_endpoints:
    # The rota tool rotated its key when the studio changed plan. It still answers; it just will
    # not accept this caller.
    - id: rota
      url: 'https://rota.glowhaus.example/hooks/bookings'
      auth: { header: Authorization, token: 'Bearer rota_live_9f2c' }
      ok_status: 200
      unauthorized_status: 401
  workflows:
    - id: wf-rota-sync
      name: Rota Sync
      trigger:
        ghl_feature_id: GHL-WF-CUSTOMER-BOOKED-APPOINTMENT
        filters: []
      nodes:
        - id: n1
          type: action
          ghl_feature_id: GHL-WF-CUSTOM-WEBHOOK
          label: Push the booking to the rota
          config:
            url: 'https://rota.glowhaus.example/hooks/bookings'
            method: POST
            headers: { Authorization: 'Bearer rota_live_4a71' }
            custom_data:
              { first_name: '{{contact.first_name}}', appointment: '{{appointment.date}}' }
          position: { x: 0, y: 120 }
        - {
            id: n2,
            type: action,
            ghl_feature_id: GHL-WF-ADD-CONTACT-TAG,
            label: Tag as synced,
            config: { tag: booked },
            position: { x: 0, y: 240 },
          }
        - { id: n3, type: end, position: { x: 0, y: 360 } }
      edges:
        - { from: n1, to: n2 }
        - { from: n2, to: n3 }
      settings: { allow_reentry: true, timezone: America/Chicago }
simulation_time: '2026-09-07T09:00:00-05:00'
timezone: America/Chicago
seed: 4103
scheduled_events:
  - at: '2026-09-07T09:15:00-05:00'
    type: appointment.booked
    payload:
      {
        appointment_id: ap-dev,
        contact_id: dev,
        calendar_id: consultation,
        starts_at: '2026-09-10T10:00:00-05:00',
        host_id: priya,
        booked_by: customer,
      }
    description: Dev books a consultation, which should reach the rota
injectable_events:
  - id: another-booking
    type: appointment.booked
    description: Book again and watch the webhook response, to see whether the fix took.
    payload:
      {
        appointment_id: ap-dev-retry,
        contact_id: dev,
        calendar_id: consultation,
        minutes_from_now: 2880,
        host_id: priya,
        booked_by: customer,
      }
hidden_facts:
  what_changed: 'The rota tool rotated its API key when Glowhaus moved plan. Nobody updated the workflow.'
failure_modes: [invalid_webhook_auth]
incident:
  title: The booking sync that stopped syncing
  symptom: >-
    Rota Sync runs on every booking and its webhook step is in the execution log every time. The
    response that came back is not a success, and the workflow carried on to the next step
    regardless.
  client_complaint: >-
    "The front desk has been writing consultations onto a paper list for two weeks because they
    stopped showing up in our rota. Nobody changed anything on our side."
  failure_mode: invalid_webhook_auth
  inspect:
    - The Rota Sync execution log, at the webhook step, and the status it came back with
    - The headers the webhook step sends
    - What the rota endpoint expects, in the simulated services this scenario describes
  reproduce:
    - Run the queued booking.
    - Read the response status and the failure reason. A refused credential and a failing service
      are different problems with different fixes.
