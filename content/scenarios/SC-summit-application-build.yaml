id: SC-summit-application-build
title: Summit — an application path to build
client: CL-summit-coaching
summary: Marcus needs an application with a qualification step before booking, a confirmation and an
  accountable follow-up. Build the path in the shared account and test submissions.
initial_account_state:
  users:
    - id: priya
      name: Marcus Vale
      role: admin
  contacts:
    - id: nadia
      first_name: Nadia
      last_name: Haddad
      email: nadia.haddad@example.com
      phone: '+15125550188'
      tags:
        - returning
      custom_fields:
        treatment_interest: Business coaching
      timezone: America/Chicago
      source: Returning client
      owner_id: priya
  tags:
    - returning
    - new-lead
    - meta-lead
    - booked
    - member
  custom_fields:
    - key: treatment_interest
      label: Coaching goal
      type: dropdown
      options:
        - Business coaching
        - Leadership coaching
        - Team coaching
    - key: budget_band
      label: Budget band
      type: dropdown
      options:
        - Under 200
        - 200 to 500
        - Over 500
  custom_values:
    - key: front_desk_phone
      value: '+15125550100'
  pipelines:
    - id: consultations
      name: Consultations
      stages:
        - New Lead
        - Booked
        - Showed
        - Won
        - Lost
  calendars:
    - id: consultation
      name: Consultation
      type: personal
      duration_minutes: 30
      slot_interval_minutes: 30
      minimum_notice_minutes: 60
      timezone: America/Chicago
      staff_ids:
        - priya
      availability:
        - day: 1
          start: 09:00
          end: 17:00
        - day: 2
          start: 09:00
          end: 17:00
        - day: 3
          start: 09:00
          end: 17:00
        - day: 4
          start: 09:00
          end: 17:00
        - day: 5
          start: 09:00
          end: 17:00
      locations:
        - id: studio
          kind: address
          value: 2400 South Lamar, Austin
      default_location_id: studio
  forms:
    - id: consult-request
      name: Coaching Application
      fields:
        - first_name
        - last_name
        - email
        - phone
        - treatment_interest
  surveys:
    - id: fit-check
      name: Readiness Review
      fields:
        - treatment_interest
        - budget_band
  products: []
  workflows:
    - id: wf-new-lead-welcome
      name: New Lead Welcome
      trigger:
        ghl_feature_id: GHL-WF-FORM-SUBMITTED
        filters:
          - field: form
            operator: is
            value: consult-request
      nodes:
        - id: n1
          type: action
          ghl_feature_id: GHL-WF-ADD-CONTACT-TAG
          label: Tag the lead
          config:
            tag: new-lead
          position:
            x: 0
            y: 120
        - id: n2
          type: action
          ghl_feature_id: GHL-WF-SEND-SMS
          label: Welcome text
          config:
            template:
              'Hi {{contact.first_name}}, thanks for asking about a consultation at Summit. Pick a time
              here: https://summit.example.com/book'
            purpose: welcome
          position:
            x: 0
            y: 240
        - id: n3
          type: end
          position:
            x: 0
            y: 360
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
      settings:
        allow_reentry: false
        timezone: America/Chicago
  funnels: []
simulation_time: 2026-09-08T09:00:00-05:00
timezone: America/Chicago
seed: 5309
scheduled_events: []
injectable_events:
  - id: nadia-books
    type: appointment.booked
    description: Nadia books a consultation for 90 minutes from now, without going through a funnel.
    payload:
      contact_id: nadia
      calendar_id: consultation
      minutes_from_now: 90
hidden_facts:
  ad_spend_planned_monthly: 1200
  consultations_wanted_monthly: 20
  front_desk_reply_delay_hours: 26
failure_modes:
  - missing_field
  - duplicate_contact
