# SIM-011 · dnd. A number that works, a workflow that ran, and still no text.
#
# Deliberately the same symptom as the missing-phone incident and a different cause, because
# telling those two apart is the skill. Marisol has a phone number. What she also has is
# do-not-disturb, which HighLevel honours on every outbound channel, and the execution log names
# it. A learner who diagnoses "no phone number" here has pattern-matched rather than looked.
id: SC-glowhaus-incident-dnd
title: Glowhaus — a number that works and a text that does not
client: CL-glowhaus-medspa
summary: >-
  Marisol booked a consultation and never got her confirmation. Her phone number is on the record
  and it is correct. The workflow reached Send SMS and the account holds no message.
initial_account_state:
  users:
    - { id: priya, name: Priya Raman, role: admin }
  contacts:
    - id: marisol
      first_name: Marisol
      last_name: Vega
      email: 'marisol.vega@example.com'
      phone: '+15125550144'
      dnd: true
      timezone: America/Chicago
      source: Referral
      owner_id: priya
  tags: [booked]
  calendars:
    - id: consultation
      name: Consultation
      type: personal
      duration_minutes: 30
      slot_interval_minutes: 30
      minimum_notice_minutes: 60
      timezone: America/Chicago
      staff_ids: [priya]
      availability:
        - { day: 1, start: '09:00', end: '17:00' }
        - { day: 2, start: '09:00', end: '17:00' }
        - { day: 3, start: '09:00', end: '17:00' }
        - { day: 4, start: '09:00', end: '17:00' }
        - { day: 5, start: '09:00', end: '17:00' }
  workflows:
    - id: wf-booking-confirmation
      name: Booking Confirmation
      trigger:
        ghl_feature_id: GHL-WF-CUSTOMER-BOOKED-APPOINTMENT
        filters: []
      nodes:
        - {
            id: n1,
            type: action,
            ghl_feature_id: GHL-WF-ADD-CONTACT-TAG,
            label: Tag as booked,
            config: { tag: booked },
            position: { x: 0, y: 120 },
          }
        - id: n2
          type: action
          ghl_feature_id: GHL-WF-SEND-SMS
          label: Confirm the booking
          config:
            template: 'You are booked, {{contact.first_name}}. See you at the studio.'
            purpose: confirmation
          position: { x: 0, y: 240 }
        - { id: n3, type: end, position: { x: 0, y: 360 } }
      edges:
        - { from: n1, to: n2 }
        - { from: n2, to: n3 }
      settings: { allow_reentry: false, timezone: America/Chicago }
simulation_time: '2026-09-07T09:00:00-05:00'
timezone: America/Chicago
seed: 4102
scheduled_events:
  - at: '2026-09-07T09:20:00-05:00'
    type: appointment.booked
    payload:
      {
        appointment_id: ap-marisol,
        contact_id: marisol,
        calendar_id: consultation,
        starts_at: '2026-09-09T14:00:00-05:00',
        host_id: priya,
        booked_by: customer,
      }
    description: Marisol books a consultation for Wednesday
injectable_events:
  - id: rebook
    type: appointment.booked
    description: Book Marisol again, to see whether the confirmation goes out this time.
    payload:
      {
        appointment_id: ap-marisol-2,
        contact_id: marisol,
        calendar_id: consultation,
        minutes_from_now: 2880,
        host_id: priya,
        booked_by: customer,
      }
hidden_facts:
  when_dnd_was_set: 'Two months ago, after a promotional campaign'
failure_modes: [dnd]
incident:
  title: A number that works and a text that does not
  symptom: >-
    Marisol has a valid mobile number on her contact record. The Booking Confirmation workflow
    enrolled her and reached its Send SMS step. Her conversation holds nothing, and the account
    counted no message sent.
  client_complaint: >-
    "She rang the studio to check we had her booking because she never got a text. I can see her
    number right there on the screen, so what happened?"
  failure_mode: dnd
  inspect:
    - Marisol's contact record, all of it
    - The Booking Confirmation execution log, at the Send SMS step
  reproduce:
    - Run the queued booking.
    - Read the reason on the Send SMS step. It is not the same reason as an empty phone field.
