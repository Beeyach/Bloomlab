            - {
                id: bl-landing-problem,
                role: problem,
                body: 'Nothing you have tried has lasted past a fortnight.',
              }
            - {
                id: bl-landing-outcome,
                role: outcome,
                body: 'A plan built around your skin, not a package someone else bought.',
              }
            - {
                id: bl-landing-cta,
                role: cta,
                headline: 'Ask for a consultation',
                target_step_id: st-apply,
              }
        - id: st-apply
          name: Tell us about your skin
          purpose: capture
          next_step_id: st-book
          blocks:
            - {
                id: bl-apply-headline,
                role: headline,
                headline: 'Five questions, then pick a time',
              }
            - { id: bl-apply-form, role: form, reference_id: consult-request }
        - id: st-book
          name: Pick a time
          purpose: booking
          next_step_id: st-thanks
          blocks:
            - { id: bl-book-headline, role: headline, headline: 'When suits you?' }
            - { id: bl-book-calendar, role: calendar, reference_id: consultation }
        - id: st-thanks
          name: You are booked
          purpose: confirmation
          blocks:
            - { id: bl-thanks-headline, role: headline, headline: 'See you at the studio' }
