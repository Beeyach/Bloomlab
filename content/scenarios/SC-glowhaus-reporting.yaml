# Glowhaus's three-week paid push, as it actually happened (REP-001, REP-002, EXR-010, FUN-004).
#
# Everything the report shows is built here from facts rather than seeded as a total: forty
# funnel visits with where each came from and how far down each step it got, fourteen form
# submissions that create the leads, the front desk's texts and the replies to them, eleven
# bookings, what happened on the day, the deals, the money and one refund. The report derives
# every one of its ten numbers from that history, so a reviewer can check the arithmetic by
# reading the events rather than trusting a figure.
#
# The window is deliberately small enough to add up by hand. Forty visits, fourteen leads,
# eleven bookings, nine appointments that came due, four of them showed. The leak is in the
# middle of that chain and the data supports saying so — but nothing in the interface says it,
# because working that out is the exercise.
#
# There is no follow-up workflow here on purpose. Glowhaus texts new leads by hand, which is why
# time to contact is six minutes for most people, a day for one, and never for two: one lead
# filled the form in without a phone number, and one rang to ask not to be texted.
id: SC-glowhaus-reporting
title: Glowhaus — three weeks of paid traffic
client: CL-glowhaus-medspa
summary: >-
  Glowhaus spent three weeks sending paid traffic to a consultation funnel. Forty people visited,
  fourteen asked for a consultation, eleven booked one. The money that came out the other end is
  smaller than any of those numbers suggest, and the report holds every fact needed to say why.
