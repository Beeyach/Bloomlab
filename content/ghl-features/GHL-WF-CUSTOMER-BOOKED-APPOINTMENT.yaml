id: GHL-WF-CUSTOMER-BOOKED-APPOINTMENT
official_name: Customer Booked Appointment
area: Workflows
feature_type: trigger
implementation_type: native_ghl
status: current
simulation_fidelity: A
last_verified: 2026-09-04
source_url: https://help.gohighlevel.com/support/solutions/articles/155000002675-workflow-trigger-customer-booked-appointment
known_limitations:
  - >-
    Fires for bookings the customer makes; staff-made bookings use Appointment Status instead. The simulator follows the same split, and how a booking was made is recorded on the appointment, so a reschedule of a staff booking is still a staff booking.
  - >-
    A run this trigger starts is about that appointment: it is pulled out when the appointment is cancelled, marked invalid or no-show, or rescheduled, and a reschedule fires the trigger again as a new booking (see GHL-WF-APPOINTMENT-STATUS).
skills:
  - SK-BUILD-consultation-calendar
  - SK-AUTOMATE-appointment-reminders
supported_configs:
  filters:
    - In Calendar
    - Has tag
