known_limitations:
  - Duplicate detection follows the simulator's rule (same email or phone); GHL's merge tooling is not reproduced.
  - DND is one flag on the contact. HighLevel applies Do Not Disturb globally or per channel (Email, SMS, Calls, Facebook Messenger, GMB, WhatsApp) and per direction; Bloomlab's flag means "all channels, outbound".
  - The owner field is called Assigned User on the contact-creation form and Contact Owner elsewhere; Bloomlab shows one name for it.
