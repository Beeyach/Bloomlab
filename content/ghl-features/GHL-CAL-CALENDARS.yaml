id: GHL-CAL-CALENDARS
official_name: Calendars
area: Calendars
feature_type: entity
implementation_type: native_ghl
status: current
simulation_fidelity: B
last_verified: 2026-09-04
source_url: https://help.gohighlevel.com/support/solutions/articles/48001155718-adjusting-availability-settings-for-individual-calendars
known_limitations:
  - Simulated — Personal Booking, Round Robin and Service calendars with weekly working hours,
    appointment duration, slot interval, pre and post buffer, minimum scheduling notice, a booking
    window, a team with an order, both round-robin distribution methods, staff selection, services
    that set their own duration and eligible staff, meeting locations, and cancellation and
    reschedule permissions with a cutoff.
  - Not simulated — date-specific hours, linked and conflict calendars, Look Busy,
    appointments-per-day limits, calendar groups, recurring appointments, Collective, Group and
    Event calendars, the separate Rooms & Equipment configuration, and payment at booking. Phase 25
    adds Class Booking seats and service resources, separately sourced in GHL-CAL-CLASSES and
    GHL-CAL-RESOURCES.
  - Optimize for Equal Distribution counts each team member's bookings on that calendar in the
    slot's own month and gives the booking to whoever has fewest, ties broken by the order the
    calendar lists them. HighLevel additionally limits a member's availability temporarily when they
    run too far ahead of the team; that part is not simulated.
  - Zoom and Google Meet locations store a link the learner supplies. Bloomlab creates no meeting on
    either platform and generates no dynamic link.
  - Working hours are whole windows inside one day in the calendar's own zone, between 00:00 and
    23:59. A window that crosses midnight is authored as two.
