approximation_note: Training approximation — Personal, Round Robin, Service and Class Booking use
  the same availability engine. Class seat capacity and service resource reservations have their own
  current registry records. Collective, Group and Event calendars and payment at booking remain
  real-GHL practice.
verification_note: Calendar types, availability settings, both round-robin distribution methods,
  staff selection, service duration and staff assignment, the six meeting-location kinds and the
  cancellation and reschedule toggles were confirmed on 2026-09-04 from search-result summaries of
  the official help-centre articles listed above. The articles could not be opened directly from the
  build environment, whose proxy refuses help.gohighlevel.com with a 403.
